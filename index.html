<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สมุดยิม</title>
<meta name="description" content="บันทึกการเล่นยิม เช็ก progressive overload และติดตามสารอาหาร">
<meta name="theme-color" content="#ECEFF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1419" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="สมุดยิม">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <div class="banner" id="update" hidden><span>มีเวอร์ชันใหม่ของแอป</span><button type="button" class="btn" data-act="update">อัปเดต</button></div>
  <div class="banner" id="drivebar" hidden><span>แตะเพื่อซิงก์ข้อมูลกับ Google Drive</span><button type="button" class="btn" data-act="dsync">ซิงก์</button></div>
  <header class="top" id="top"></header>
  <main id="main"></main>
</div>
<div class="timer" id="timer" hidden>
  <div class="box">
    <span class="t" id="tTime">0:00</span>
    <span class="msg" id="tMsg">พักก่อนเซ็ตถัดไป</span>
    <button type="button" data-act="t30">+30 วิ</button>
    <button type="button" data-act="tstop">ปิด</button>
  </div>
</div>
<nav class="tabs" aria-label="เมนู"><div class="in">
  <button type="button" data-view="today">วันนี้</button>
  <button type="button" data-view="food">อาหาร</button>
  <button type="button" data-view="progress">พัฒนาการ</button>
  <button type="button" data-view="report">สรุป</button>
  <button type="button" data-view="settings">ตั้งค่า</button>
</div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:16px">แอปนี้ต้องเปิด JavaScript</p></noscript>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
